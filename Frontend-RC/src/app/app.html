<!-- Application Shell -->
<div class="min-h-screen bg-[#0b111e] text-gray-150 flex flex-col">
  
  <!-- Fixed Topbar (only shown when logged in) -->
  <header *ngIf="currentUser && currentUser.role === 'admin'" class="bg-[#151c2c] border-b border-gray-800 sticky top-0 z-40 shadow-lg px-4 md:px-8 py-3.5 flex items-center justify-between">
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center shadow-lg shadow-emerald-500/10">
        <i class="pi pi-calendar-plus"></i>
      </div>
      <div>
        <h2 class="text-sm font-extrabold bg-gradient-to-r from-emerald-400 to-blue-400 bg-clip-text text-transparent">Slotly</h2>
        <p class="text-[9px] text-gray-500">Gestión de Canchas</p>
      </div>
    </div>

    <!-- Navigation Menu (generated dynamically with @for as requested by teacher) -->
    <nav class="hidden md:flex gap-1.5 bg-[#0b111e] p-1 rounded-lg border border-gray-850">
      @for (opt of menuOptions; track opt.route) {
        <button
          (click)="navigate(opt.route)"
          [class]="opt.active ? 'bg-emerald-600 text-white font-bold' : 'text-gray-400 hover:text-gray-250'"
          class="px-4 py-1.5 rounded text-xs transition-all outline-none border-none cursor-pointer flex items-center gap-1.5"
        >
          <i [class]="opt.icon + ' text-[10px]'"></i>
          <span>{{ opt.text }}</span>
        </button>
      }
    </nav>

    <!-- User Profile with PrimeNG popup p-menu -->
    <div class="flex items-center gap-3">
      <div class="flex flex-col text-right">
        <span class="text-xs font-bold text-gray-200">{{ currentUser.name }}</span>
        <span class="text-[9px] text-gray-500 uppercase font-semibold tracking-wider">
          {{ currentUser.role === 'admin' ? 'Administrador' : currentUser.role === 'owner' ? 'Dueño' : 'Cliente' }}
        </span>
      </div>
      
      <!-- Trigger button for popup menu -->
      <button
        #btn
        pButton
        type="button"
        icon="pi pi-user"
        (click)="menu.toggle($event)"
        class="w-8 h-8 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition-all flex items-center justify-center cursor-pointer p-0"
      >
      </button>
      
      <!-- PrimeNG Popup Menu -->
      <p-menu #menu [model]="profileMenuItems" [popup]="true" styleClass="custom-profile-menu"></p-menu>
    </div>
  </header>

  <!-- Mobile bottom nav (shown when logged in) -->
  <div *ngIf="currentUser && currentUser.role === 'admin'" class="md:hidden fixed bottom-0 left-0 right-0 bg-[#151c2c] border-t border-gray-800 z-40 py-2 px-6 flex justify-around text-[10px] shadow-2xl">
    @for (opt of menuOptions; track opt.route) {
      <button
        (click)="navigate(opt.route)"
        [class]="opt.active ? 'text-emerald-400 font-bold' : 'text-gray-400'"
        class="flex flex-col items-center gap-1 bg-transparent border-none outline-none transition-all cursor-pointer"
      >
        <i [class]="opt.icon + ' text-base'"></i>
        <span>{{ opt.text }}</span>
      </button>
    }
    <button (click)="logout()" class="flex flex-col items-center gap-1 bg-transparent border-none outline-none text-red-400 transition-all cursor-pointer">
      <i class="pi pi-power-off text-base"></i>
      <span>Salir</span>
    </button>
  </div>

  <!-- Content Wrapper -->
  <main [class.pt-0]="!currentUser" class="flex-1 flex flex-col justify-start pb-16 md:pb-0">
    <router-outlet></router-outlet>
  </main>
</div>
