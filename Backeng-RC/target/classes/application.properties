# Server configuration1
server.port=${PORT:8080}

# Conexion Railway: usa las variables individuales MYSQL* que Railway inyecta
# Internamente usa mysql.railway.internal (red interna), mas estable que la URL publica
spring.datasource.url=jdbc:mysql://${MYSQLHOST:zephyr.proxy.rlwy.net}:${MYSQLPORT:11914}/${MYSQLDATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:mMURLCgGrZOvqnLydPsCoaRyFUuqHGyW}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator: healthcheck para Railway (responde en /actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI/Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=alpha

# Security configuration (OAuth2 JWT)
# Por defecto, se usa un JwtDecoder simulado para dev/local (no se requiere Keycloak/Firebase).
# Para conectar a Keycloak, descomentar:
# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/canchacraft